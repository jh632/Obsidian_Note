<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
  <title id="title">四类日常工作 SOP 速查</title>
  <desc id="desc">需求确认、会议、周报和文件管理的触发场景、关键步骤与完成检查，以及从小清单开始持续改进的方法。</desc>
  <defs>
    <style>
      text { font-family: 'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', sans-serif; }
      .heading { font-size: 28px; font-weight: 700; fill: #152b43; }
      .body { font-size: 22px; fill: #30465d; }
      .label { font-size: 18px; fill: #52677c; }
      .step { font-size: 20px; font-weight: 600; }
      .number { font-size: 22px; font-weight: 700; fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 9 5 L 0 10" fill="none" stroke="#75879a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1280" height="880" rx="28" fill="#f2f5fa"/>
  <text x="60" y="72" font-size="38" font-weight="700" fill="#152b43">把重复工作写成清单</text>
  <text x="60" y="112" class="body">四类日常工作 SOP · 明确交付、形成记录、方便查找</text>

  <rect x="50" y="148" width="576" height="260" rx="20" fill="#ffffff" stroke="#dce5ef"/>
  <circle cx="91" cy="191" r="22" fill="#3379b7"/>
  <text x="91" y="199" class="number" text-anchor="middle">1</text>
  <text x="127" y="201" class="heading">需求确认</text>
  <text x="80" y="244" class="label">触发：接到任务</text>
  <rect x="80" y="265" width="150" height="44" rx="10" fill="#eaf3fc"/>
  <rect x="268" y="265" width="136" height="44" rx="10" fill="#eaf3fc"/>
  <rect x="442" y="265" width="154" height="44" rx="10" fill="#eaf3fc"/>
  <text x="155" y="294" class="step" text-anchor="middle" fill="#286499">确认四项</text>
  <text x="336" y="294" class="step" text-anchor="middle" fill="#286499">复述理解</text>
  <text x="519" y="294" class="step" text-anchor="middle" fill="#286499">开始执行</text>
  <path d="M 238 287 H 258" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 412 287 H 432" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="350" class="body">交付物 · 期限 · 资源 · 协作对象</text>
  <text x="80" y="384" class="label">完成检查：双方对任务的理解是否一致？</text>

  <rect x="654" y="148" width="576" height="260" rx="20" fill="#ffffff" stroke="#dce5ef"/>
  <circle cx="695" cy="191" r="22" fill="#27846e"/>
  <text x="695" y="199" class="number" text-anchor="middle">2</text>
  <text x="731" y="201" class="heading">会议</text>
  <text x="684" y="244" class="label">触发：需要集体讨论与决定</text>
  <rect x="684" y="265" width="150" height="44" rx="10" fill="#e8f5ef"/>
  <rect x="872" y="265" width="136" height="44" rx="10" fill="#e8f5ef"/>
  <rect x="1046" y="265" width="154" height="44" rx="10" fill="#e8f5ef"/>
  <text x="759" y="294" class="step" text-anchor="middle" fill="#23735f">会前定议程</text>
  <text x="940" y="294" class="step" text-anchor="middle" fill="#23735f">会中记要点</text>
  <text x="1123" y="294" class="step" text-anchor="middle" fill="#23735f">会后发纪要</text>
  <path d="M 842 287 H 862" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1016 287 H 1036" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="350" class="body">结论 · 待办 · 负责人 · 截止时间</text>
  <text x="684" y="384" class="label">完成检查：每个人是否知道下一步做什么？</text>

  <rect x="50" y="432" width="576" height="260" rx="20" fill="#ffffff" stroke="#dce5ef"/>
  <circle cx="91" cy="475" r="22" fill="#8464ae"/>
  <text x="91" y="483" class="number" text-anchor="middle">3</text>
  <text x="127" y="485" class="heading">周报</text>
  <text x="80" y="528" class="label">触发：每周同步工作</text>
  <rect x="80" y="549" width="150" height="44" rx="10" fill="#f1ecf8"/>
  <rect x="268" y="549" width="136" height="44" rx="10" fill="#f1ecf8"/>
  <rect x="442" y="549" width="154" height="44" rx="10" fill="#f1ecf8"/>
  <text x="155" y="578" class="step" text-anchor="middle" fill="#725399">本周完成</text>
  <text x="336" y="578" class="step" text-anchor="middle" fill="#725399">下周计划</text>
  <text x="519" y="578" class="step" text-anchor="middle" fill="#725399">需要支持</text>
  <path d="M 238 571 H 258" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 412 571 H 432" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="80" y="634" class="body">写结果与数据 · 标优先级 · 说清请求</text>
  <text x="80" y="668" class="label">完成检查：成果和支持需求是否具体？</text>

  <rect x="654" y="432" width="576" height="260" rx="20" fill="#ffffff" stroke="#dce5ef"/>
  <circle cx="695" cy="475" r="22" fill="#b27b2c"/>
  <text x="695" y="483" class="number" text-anchor="middle">4</text>
  <text x="731" y="485" class="heading">文件管理</text>
  <text x="684" y="528" class="label">触发：保存、修改与交付文件</text>
  <rect x="684" y="549" width="150" height="44" rx="10" fill="#fcf3e4"/>
  <rect x="872" y="549" width="136" height="44" rx="10" fill="#fcf3e4"/>
  <rect x="1046" y="549" width="154" height="44" rx="10" fill="#fcf3e4"/>
  <text x="759" y="578" class="step" text-anchor="middle" fill="#976722">统一命名</text>
  <text x="940" y="578" class="step" text-anchor="middle" fill="#976722">更新版本</text>
  <text x="1123" y="578" class="step" text-anchor="middle" fill="#976722">交付核对</text>
  <path d="M 842 571 H 862" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1016 571 H 1036" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="684" y="634" class="body">日期_项目_版本_姓名 · 定期归档</text>
  <text x="684" y="668" class="label">完成检查：能否快速找到所需文件与版本？</text>

  <rect x="50" y="726" width="1180" height="112" rx="20" fill="#e4ebf3"/>
  <text x="80" y="765" font-size="20" font-weight="700" fill="#30465d">从一项经常出错、耗时的工作开始</text>
  <text x="80" y="810" class="body">写最小清单</text>
  <path d="M 235 802 H 310" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="342" y="810" class="body">实际使用</text>
  <path d="M 475 802 H 550" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="582" y="810" class="body">发现遗漏</text>
  <path d="M 715 802 H 790" fill="none" stroke="#75879a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="822" y="810" class="body">修订后继续使用</text>
</svg>
